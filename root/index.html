<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="introduction">
      <section class="intro-content">
        <nav class="header">
          <section class="logo-section">
            <div class="logo">
              <img src="../images/logo_01.png" alt="Filled logo" />
              <div class="name">Influenzailla</div>
            </div>
            <div class="desc">bespoke design and marketing services</div>
          </section>
          <section class="menu">
            <div id="upper-menu" class="upper">
              <div>
                <img src="../images/ico_globe.png" alt="Small Globe Icon" />
              </div>
            </div>
            <div id="bottom-menu" class="bottom"></div>
          </section>
        </nav>
        <section class="year-section">
          <div class="year-text">2023</div>
          <div class="desc">hi there, let's <br />get started!</div>
        </section>
        <section class="influence-section">
          <img
            class="influence-icon"
            src="../images/ico_line.png"
            alt="Colorful line"
          />
          <div class="influence-text">
            Influence your <br />
            audience
          </div>
          <div class="believe-section">
            <img src="../images/logo_02.png" alt="Logo" />
            <div class="believe-text">
              We believe in the power of digital media to transform businesses
              and connect them with their audiences in meaningful ways.
            </div>
          </div>
        </section>
        <section class="footer-section">
          <div id="footer-id" class="footer-content"></div>
        </section>
      </section>
    </main>
    <script src="../js/mapper.js"></script>
  </body>
</html>
