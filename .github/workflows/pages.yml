name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site

          cp -r root/* _site/
          cp -r css _site/
          cp -r images _site/
          cp -r js _site/

          # Fix paths for the deployed site only.
          sed -i 's#\.\./css/#css/#g' _site/index.html
          sed -i 's#\.\./images/#images/#g' _site/index.html
          sed -i 's#\.\./js/#js/#g' _site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
